[package]
name = "openai-router"
version = "0.1.0"
edition = "2021"
description = "High-performance OpenAI-compatible API router with load balancing, rate limiting, and access control"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "auth"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls-native-roots"], default-features = false }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Config hot-reload
notify = { version = "6", features = ["macos_kqueue"] }
arc-swap = "1"

# Concurrency
dashmap = "5"
parking_lot = "0.12"

# Rate limiting
governor = "0.6"

# Metrics
prometheus = "0.13"
lazy_static = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for session IDs
uuid = { version = "1", features = ["v4", "v7"] }

# Time
chrono = "0.4"
tokio-util = "0.7"

# Error handling
thiserror = "1"
anyhow = "1"
bytes = "1"

# JSON pointer for path access
tower-cookies = "0.10"

# Optional PostgreSQL
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"], optional = true }

# Optional Redis/Valkey (multi-instance sync)
redis = { version = "0.25", features = ["tokio-comp", "aio"], optional = true }

[features]
default = ["postgres", "redis-sync"]
postgres = ["sqlx"]
redis-sync = ["redis"]
