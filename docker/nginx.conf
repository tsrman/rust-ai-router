# nginx reverse proxy for openai-router cluster
events { worker_connections 1024; }

http {
    upstream openai_router {
        least_conn;
        server router1:8080 max_fails=3 fail_timeout=10s;
        server router2:8080 max_fails=3 fail_timeout=10s;
        server router3:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_body_timeout   30s;
        client_header_timeout 10s;
        keepalive_timeout     60s;
        send_timeout          60s;

        proxy_connect_timeout 10s;
        proxy_read_timeout   300s;
        proxy_send_timeout    60s;

        gzip on;
        gzip_types application/json text/event-stream;

        location / {
            proxy_pass http://openai_router;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
