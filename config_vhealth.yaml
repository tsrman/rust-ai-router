  timeouts:
    client_idle_secs: 60

teams:
  - name: "default"
    models: ["deepseek-chat"]

tokens:
  - key: "sk-test"
    team: "default"

models:
  - name: "deepseek-chat"
    endpoints:
      - url: "https://api.deepseek.com"
